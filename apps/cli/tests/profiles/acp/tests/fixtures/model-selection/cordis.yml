# Keyless patch over `dsh --profile acp` that opts into the superseded model
# surface a client predating `session/set_config_option` requires.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: acp
  name: '@deepseek-ai/dsh-acp'
  config:
    provider: model-selection-fixture
    model: alpha
    modelOptions: flat
    legacyModelSelection: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_MODEL_SELECTION_ROOT
    compression: none

- insert:
    - id: model-selection-llm
      name: './model-selection-llm.ts'
